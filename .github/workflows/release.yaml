name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the CLI
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/kuberoot-dev/kubepkg/pkg/version.Version=${GITHUB_REF_NAME}" \
              -o "dist/kubepkg-${os}-${arch}" ./cmd/kubepkg
          done
          (cd dist && sha256sum kubepkg-* > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a pre-release part (v1.0.0-rc.1) is not the latest release.
        run: |
          pre=()
          [[ "${GITHUB_REF_NAME}" == *-* ]] && pre=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes "${pre[@]}"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Publish the chart
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/kubepkg --version "${version}" --app-version "${version}" -d dist
          helm push "dist/kubepkg-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
