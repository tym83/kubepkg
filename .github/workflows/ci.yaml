name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Chart CRDs match the API
        run: diff -r config/crd charts/kubepkg/files/crds
      - run: go vet ./...
      - run: go test ./...
      - uses: azure/setup-helm@v4
      - run: helm lint charts/kubepkg
      - name: Alert rules are valid
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-3.15.0.linux-amd64/promtool
          helm template t charts/kubepkg --set metrics.prometheusRule.enabled=true -s templates/metrics.yaml \
            | python3 -c 'import sys, yaml; d = [x for x in yaml.safe_load_all(sys.stdin) if x and x["kind"] == "PrometheusRule"][0]; print(yaml.safe_dump({"groups": d["spec"]["groups"]}))' > rules.yaml
          ./promtool check rules rules.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        suite: [run, flux, argo, kubevirt]
    name: e2e (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: End-to-end on kind
        run: test/e2e/${{ matrix.suite }}.sh
