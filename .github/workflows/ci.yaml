name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release tags, for the chart upgrade check
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Chart CRDs match the API
        run: diff -r config/crd charts/kubepkg/files/crds
      - run: go vet ./...
      - run: go test ./...
      - uses: azure/setup-helm@v4
      - run: helm lint charts/kubepkg
      - name: The chart upgrades with --reuse-values from every release
        run: hack/chart-old-values.sh
      - name: Alert rules are valid
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-3.15.0.linux-amd64/promtool
          helm template t charts/kubepkg --set metrics.prometheusRule.enabled=true -s templates/metrics.yaml \
            | python3 -c 'import sys, yaml; d = [x for x in yaml.safe_load_all(sys.stdin) if x and x["kind"] == "PrometheusRule"][0]; print(yaml.safe_dump({"groups": d["spec"]["groups"]}))' > rules.yaml
          ./promtool check rules rules.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest and the newest supported Kubernetes, see
          # docs/reference/compatibility.md; the others use kind's default.
          - {suite: run, backend: helm, k8s: "1.35", node: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"}
          - {suite: run, backend: helm, k8s: "1.37", node: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"}
          - {suite: run, backend: werf}
          - {suite: flux, backend: flux}
          - {suite: argo, backend: argo}
          - {suite: kubevirt, backend: helm}
          - {suite: bundle, backend: helm}
          - {suite: adopt, backend: helm}
    name: e2e (${{ matrix.suite }}, ${{ matrix.backend }}${{ matrix.k8s && format(', Kubernetes {0}', matrix.k8s) || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0
      - name: Install nelm
        if: matrix.backend == 'werf'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/nelm" https://tuf.nelm.sh/targets/releases/1.31.1/linux-amd64/bin/nelm
          echo "45178ece53a9b12d1d15b53d138f0d8fedf29362b12dc146015fd85b79707633  $RUNNER_TEMP/bin/nelm" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/nelm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: End-to-end on kind
        env:
          BACKEND: ${{ matrix.backend }}
          KIND_NODE_IMAGE: ${{ matrix.node }}
        run: test/e2e/${{ matrix.suite }}.sh
