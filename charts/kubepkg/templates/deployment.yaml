{{- if and (has .Values.backend (list "helm" "werf")) (not .Values.clusterAdmin) }}
{{- fail (printf "the %s backend needs clusterAdmin: true, see values.yaml" .Values.backend) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubepkg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "kubepkg.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kubepkg.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --backend={{ .Values.backend }}
            - --api-group={{ .Values.apiGroup }}
            - --leader-elect=true
            - --cache-dir=/var/cache/kubepkg
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- with .Values.valuesSecret }}
            - --values-secret={{ . }}
            {{- end }}
            {{- range $k, $v := .Values.namespaceLabels }}
            - --namespace-label={{ $k }}={{ $v }}
            {{- end }}
            {{- if eq .Values.backend "argo" }}
            - --argo-namespace={{ .Values.argo.namespace }}
            - --argo-project={{ .Values.argo.project }}
            {{- end }}
            {{- with .Values.mirror }}
            - --mirror={{ . }}
            {{- end }}
            {{- if .Values.plainHTTP }}
            - --plain-http
            {{- end }}
          env:
            # Helm keeps its own files under HOME; the root filesystem is read-only.
            - {name: HOME, value: /tmp}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/kubepkg}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
