{{- /* CRDs are templates so upgrades update them; they stay when the chart
is removed, or every installed package would go with them. */ -}}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $annotations := merge (default (dict) $crd.metadata.annotations) (dict "helm.sh/resource-policy" "keep") }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
---
{{ toYaml $crd }}
{{- end }}
