{{- $policy := .Values.imagePolicy | default "off" }}
{{- if not (has $policy (list "off" "warn" "enforce")) }}
{{- fail (printf "imagePolicy is %q; off, warn or enforce" $policy) }}
{{- end }}
{{- if ne $policy "off" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webhook
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubepkg.labels" . | nindent 4 }}
spec:
  selector: {{- include "kubepkg.selector" . | nindent 4 }}
  ports:
    - {name: webhook, port: 443, targetPort: webhook}
---
# The operator fills in the CA bundle with the certificate it issues.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ .Release.Name }}-images
  labels: {{- include "kubepkg.labels" . | nindent 4 }}
webhooks:
  - name: pods.images.kubepkg.dev
    clientConfig:
      service: {name: {{ .Release.Name }}-webhook, namespace: {{ .Release.Namespace }}, path: /mutate-pods, port: 443}
    rules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [pods], scope: Namespaced}
    # Only namespaces the operator labelled for the policy.
    namespaceSelector:
      matchExpressions:
        - {key: kubepkg.dev/image-policy, operator: In, values: [warn, enforce]}
    # enforce means no pod there starts without the webhook's say;
    # warn never stands in the way.
    failurePolicy: {{ if eq $policy "enforce" }}Fail{{ else }}Ignore{{ end }}
    sideEffects: None
    admissionReviewVersions: [v1]
    timeoutSeconds: 10
    reinvocationPolicy: IfNeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-webhook
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubepkg.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Release.Name }}-webhook-tls]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-webhook
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubepkg.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-webhook}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-webhook
  labels: {{- include "kubepkg.labels" . | nindent 4 }}
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [{{ .Release.Name }}-images]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-webhook
  labels: {{- include "kubepkg.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-webhook}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
{{- end }}
