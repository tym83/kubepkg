apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: packages.kubepkg.dev
spec:
  group: kubepkg.dev
  names:
    kind: Package
    listKind: PackageList
    plural: packages
    shortNames:
    - pkg
    - pkgs
    singular: package
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Selected variant
      jsonPath: .spec.variant
      name: Variant
      type: string
    - description: Applied version
      jsonPath: .status.version
      name: Version
      type: string
    - description: Current revision
      jsonPath: .status.currentRevision
      name: Revision
      type: integer
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: Ready message
      jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Status
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Package is the desired state of one installed package. The name is the
          package name and matches its PackageSource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PackageSpec defines the desired state of Package
            properties:
              components:
                additionalProperties:
                  description: PackageComponent defines overrides for a specific component
                  properties:
                    enabled:
                      description: |-
                        Enabled indicates whether this component should be installed
                        If false, the component will be disabled even if it's defined in the PackageSource
                      type: boolean
                    namespace:
                      description: Namespace overrides the namespace the component
                        is installed into.
                      type: string
                    releaseName:
                      description: |-
                        ReleaseName overrides the component's release name, e.g. to take
                        over a release installed before under another name.
                      type: string
                    values:
                      description: |-
                        Values contains Helm chart values as a JSON object
                        These values will be merged with the default values from the PackageSource
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                description: |-
                  Components is a map of release name to component overrides
                  Allows overriding values and enabling/disabling specific components from the PackageSource
                type: object
              crdPolicy:
                description: |-
                  CRDPolicy decides what happens to owned CRDs when the package is
                  removed. Retain (default) keeps them; Delete removes them and every
                  object of their kinds.
                enum:
                - Retain
                - Delete
                type: string
              ignoreDependencies:
                description: |-
                  IgnoreDependencies is a list of package source dependencies to ignore
                  Dependencies listed here will not be installed even if they are specified in the PackageSource
                items:
                  type: string
                type: array
              repository:
                description: |-
                  Repository restricts version selection to the named Repository. Empty
                  considers all of them, by priority. Ignored when a PackageSource for
                  the package was written by hand.
                type: string
              revisionHistoryLimit:
                description: RevisionHistoryLimit is how many PackageRevisions to
                  keep. Default 10.
                format: int32
                minimum: 1
                type: integer
              upgrade:
                description: Upgrade controls how changes are applied.
                properties:
                  atomic:
                    description: |-
                      Atomic rolls the whole package back when a revision fails, if the
                      version being left declares rollback as safe. Default true.
                    type: boolean
                  timeout:
                    description: Timeout for every component to become healthy. Default
                      10m.
                    type: string
                type: object
              variant:
                description: |-
                  Variant is the name of the variant to use from the PackageSource
                  If not specified, defaults to "default"
                type: string
              version:
                description: |-
                  Version is a semver constraint the PackageSource version must satisfy,
                  e.g. "~1.16". Empty accepts any version.
                type: string
            type: object
          status:
            description: PackageStatus defines the observed state of Package
            properties:
              conditions:
                description: Conditions represents the latest available observations
                  of a Package's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentRevision:
                description: CurrentRevision is the revision currently applied.
                format: int64
                type: integer
              dependencies:
                additionalProperties:
                  description: DependencyStatus represents the readiness status of
                    a dependency
                  properties:
                    ready:
                      description: Ready indicates whether the dependency is ready
                      type: boolean
                  required:
                  - ready
                  type: object
                description: |-
                  Dependencies tracks the readiness status of each dependency
                  Key is the dependency package name, value indicates if the dependency is ready
                type: object
              history:
                description: History lists recent revisions, newest first.
                items:
                  description: RevisionSummary is a short record of one revision.
                  properties:
                    phase:
                      type: string
                    revision:
                      format: int64
                      type: integer
                    version:
                      type: string
                  required:
                  - revision
                  type: object
                type: array
              version:
                description: Version is the package version currently applied.
                type: string
            type: object
        type: object
