---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: repositories.kubepkg.dev
spec:
  group: kubepkg.dev
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
    - pkgrepo
    singular: repository
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.packages
      name: Packages
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Repository is a package repository the operator installs packages
          from.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RepositorySpec says where a repository index is and how much to trust
              it relative to other repositories.
            properties:
              interval:
                description: Interval between index refreshes. Default 10m.
                type: string
              priority:
                description: |-
                  Priority orders repositories that carry the same package: the
                  highest priority one shadows the others for that package, whatever
                  versions they have. Default 0.
                format: int32
                type: integer
              publicKeys:
                description: |-
                  PublicKeys are PEM encoded ed25519 keys the index must be signed
                  with: the signature is fetched from the index URL plus ".sig". With
                  none, the index is not checked. Several keys allow rotation.
                items:
                  type: string
                type: array
              url:
                description: |-
                  URL of the index, e.g. https://packages.example.org/index.yaml. The
                  scheme picks the fetcher; https:// and http:// are built in.
                type: string
            required:
            - url
            type: object
          status:
            description: RepositoryStatus reports the last index fetch.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              indexDigest:
                description: IndexDigest is the sha256 of the last accepted index.
                type: string
              indexGenerated:
                description: |-
                  IndexGenerated is when the accepted index was built; an older one is
                  refused.
                format: date-time
                type: string
              lastFetched:
                description: LastFetched is when the index was last fetched successfully.
                format: date-time
                type: string
              packages:
                description: Packages is the number of packages in the index.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
