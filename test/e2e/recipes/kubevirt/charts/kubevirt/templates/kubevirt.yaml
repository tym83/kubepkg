apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: {{ .Release.Namespace }}
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: {{ toJson .Values.featureGates }}
      {{- if .Values.emulation }}
      useEmulation: true
      {{- end }}
    imagePullPolicy: {{ .Values.imagePullPolicy }}
  customizeComponents: {}
  imagePullPolicy: {{ .Values.imagePullPolicy }}
  workloadUpdateStrategy: {}
